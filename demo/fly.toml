app = "pocketsocket-demo"
primary_region = "sjc"

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "pb_data"
  destination = "/pb/pb_data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
